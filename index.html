<script>

:`<div class="tip">${sug(r)}${rep(r)?'<br>This serial has '+rep(r)+' earlier record(s).':''}</div><button class="bt bo" onclick="EX('Serviced')">✅ Repaired &amp; sent back (Serviced)</button><button class="bt br" onclick="EX('Replacement')">🔁 Replacement given</button><button class="bt bs" onclick="EX('Sales Return')">↩️ Sales Return done</button>`}
<button class="bt bg" onclick="F0(${r.id})">Edit</button><button class="bt bg" onclick="DL()">Delete</button><button class="bt bg" onclick="X('md')">Close</button>`;O('md')}
